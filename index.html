 <!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Test IA Pompe</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/audio@0.8/dist/teachablemachine-audio.min.js"></script>
</head>
<body>
    <h1>Diagnostic IA</h1>
    <button id="btn" style="padding:20px; font-size:20px;">DÉMARRER L'ANALYSE</button>
    <div id="result" style="font-size:30px; margin-top:20px;">--</div>

    <script>
        // VERIFIE BIEN CETTE URL : Elle doit finir par un /
        const URL = "https://teachablemachine.withgoogle.com/models/oKIXEj4Fo/";

        async function init() {
            const btn = document.getElementById("btn");
            btn.innerText = "Chargement...";
            
            try {
                const checkpointURL = URL + "model.json";
                const metadataURL = URL + "metadata.json";

                const recognizer = tmAudio.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
                await recognizer.ensureModelLoaded();
                
                btn.innerText = "IA ACTIVE ✅";
                btn.style.backgroundColor = "green";

                recognizer.listen(result => {
                    const classLabels = recognizer.wordLabels();
                    const highestValue = Math.max(...result.scores);
                    const nearestClass = classLabels[result.scores.indexOf(highestValue)];
                    document.getElementById("result").innerText = nearestClass;
                }, {
                    probabilityThreshold: 0.75
                });
            } catch (e) {
                alert("Erreur technique : " + e.message);
                btn.innerText = "ERREUR";
            }
        }

        document.getElementById("btn").addEventListener("click", init);
    </script>
</body>
</html>
